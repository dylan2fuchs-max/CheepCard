<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CheepCards — Feedback</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body.dark-mode {
            background-color: #121418;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .about-wrapper {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .about-card {
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            line-height: 1.6;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="about-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <a href="{{ url_for('news.public_news') }}" class="cta-btn" style="background-color: #4a5568; color: white; padding: 10px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600;">← Back to News</a>
        </div>

        <div class="about-card">
            <h1 style="color: #fff; font-size: 1.8rem; margin-top: 0; border-bottom: 1px solid #2d3748; padding-bottom: 15px;">📬 Send Feedback</h1>
            
            <p style="margin-bottom: 20px; color: #cbd5e0;">If you are running into any trouble, have suggestions, or want to share feedback, drop a message below! I'd love to hear from you.</p>

            <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #cbd5e0;">Your Message / Issue:</label>
                    <textarea name="message" rows="5" required style="width: 100%; padding: 12px; background: #121418; border: 1px solid #4a5568; color: #fff; border-radius: 6px; resize: vertical; box-sizing: border-box;" placeholder="Type your feedback here..."></textarea>
                </div>
                <button type="submit" style="background-color: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background 0.2s;">Submit Feedback</button>
            </form>
        </div>
    </div>
</body>
</html>
