<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CheepCards</title>
    <style>
        :root {
            --bg-color: #f4f6f9; 
            --box-bg: white; 
            --text-color: #333;
            --border-color: #bdc3c7;
        }

        /* Dark Mode Theme Variables */
        body.dark-mode {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body.onyx-theme {
            --bg-color: #060608;
            --box-bg: #0f0f14;
            --text-color: #e2e8f0;
            --title-color: #38bdf8;
            --border-color: #1e293b;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            letter-spacing: 0.3px;
        }

        body.onyx-theme .panel-box,
        body.onyx-theme .arcade-header,
        body.onyx-theme .header-box {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.08);
            border: 1px solid #1e293b;
        }

        .auth-box {
            background: var(--box-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            margin: 20px;
        }

        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--border-color); 
            border-radius: 6px; 
            background-color: var(--box-bg); 
            color: var(--text-color); 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            font-size: 14px;
        }

        button[type="submit"] { 
            background-color: #3498db; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            transition: 0.2s;
        }

        button[type="submit"]:hover { background-color: #2980b9; }

        .flash-message {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .auth-link {
            display: block;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-link:hover { text-decoration: underline; }

        /* Theme Toggle Button Positioned in the Corner */
        .theme-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

            box-shadow:

                200px 1030px 0 #f1c40f, 550px 1060px 0 #3498db, 900px 1020px 0 #f1c40f, 1250px 1050px 0 #3498db, 1620px 1040px 0 #3498db, 1980px 1060px 0 #3498db, 2320px 1030px 0 #f1c40f, 2680px 1050px 0 #3498db,

                150px 1280px 0 #f1c40f, 600px 1260px 0 #3498db, 1100px 1290px 0 #f1c40f, 1600px 1270px 0 #3498db, 2050px 1290px 0 #3498db, 2500px 1260px 0 #3498db;
            opacity: 0.65;
        }
    </style>
</head>
<body class="{% if current_user.is_authenticated and current_user.default_theme %}{{ current_user.default_theme }}{% else %}{{ session.get('theme', 'dark-mode') }}{% endif %}">
    <div class="auth-box">
        <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()">🌓 Dark Mode</button>
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="height: 60px; margin-bottom: 10px;">
        <h2 style="margin-top: 0; color: var(--text-color);">Welcome Back</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required>
    
            <div style="position: relative; margin-bottom: 15px;">
                <input type="password" name="password" id="passwordInput" placeholder="Password" required style="margin-bottom: 0; padding-right: 40px; width: 100%;">
                <span onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; user-select: none;" title="Toggle Password Visibility">👁️</span>
            </div>

            <button type="submit">🔑 Login</button>
        </form>
        
        <a href="{{ url_for('forgot_password') }}" class="auth-link" style="font-size: 13px; color: #e67e22; margin-top: 12px;">Forgot your password?</a>
        <a href="{{ url_for('register') }}" class="auth-link">Don't have an account? Register here.</a>
        <a href="{{ url_for('home') }}" class="auth-link" style="color: #7f8c8d; font-size: 13px;">← Back to Dashboard</a>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('themeToggle');
            if (isDark) {
                btn.innerText = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark-mode');
            } else {
                btn.innerText = '🌓 Dark Mode';
                localStorage.setItem('theme', 'light-mode');
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.getElementById('themeToggle');
            if (savedTheme === 'light-mode') {
                document.body.classList.remove('dark-mode');
                if (btn) btn.innerText = '🌓 Dark Mode';
            } else {
                document.body.classList.add('dark-mode');
                if (btn) btn.innerText = '☀️ Light Mode';
            }
        });
    </script>
</body>
</html>
