<head>
    <meta charset="UTF-8">
    <title>Forgot Password - CheepCards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-color: #f4f6f9; 
            --box-bg: white; 
            --text-color: #333;
            --border-color: #bdc3c7;
        }

        /* Dark Mode Theme Variables */
        body.dark-mode {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body.onyx-theme {
            --bg-color: #060608;
            --box-bg: #0f0f14;
            --text-color: #e2e8f0;
            --title-color: #38bdf8;
            --border-color: #1e293b;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            letter-spacing: 0.3px;
        }

        body.onyx-theme .panel-box,
        body.onyx-theme .arcade-header,
        body.onyx-theme .header-box {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.08);
            border: 1px solid #1e293b;
        }

        .auth-box {
            background: var(--box-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            margin: 20px;
        }

        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--border-color); 
            border-radius: 6px; 
            background-color: var(--box-bg); 
            color: var(--text-color); 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            font-size: 14px;
        }

        button[type="submit"] { 
            background-color: #3498db; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            transition: 0.2s;
        }

        button[type="submit"]:hover { background-color: #2980b9; }

        .flash-message {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .auth-link {
            display: block;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-link:hover { text-decoration: underline; }

        /* Theme Toggle Button Positioned in the Corner */
        .theme-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;

<body class="dark-mode">
    <div class="auth-container">
        <h2>Reset Password</h2>
        <p>Enter your account email address and we'll send you a secure password reset link.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>
        <p class="auth-links"><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</body>
